<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT PROFILE CARD</title>
</head>
<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background:#f0f4f8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            color:#003366;
            margin-bottom:20px;
        }

        table{
            width:100%;
        }

        td{
            padding:8px;
        }

        input{
            width:100%;
            padding:8px;
            border:1px solid gray;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        #result{
            margin-top:20px;
            padding:15px;
            border:2px solid #007BFF;
            border-radius:8px;
            background:#eef5ff;
            display:none;
        }

        #result h3{
            text-align:center;
            color:#003366;
        }
    </style>

</head>

<body>

<div class="container">

<h2>Student Profile Card</h2>

<table>
<tr>
    <td><b>Student Name</b></td>
    <td><input type="text" id="name"></td>
</tr>

<tr>
    <td><b>Roll Number</b></td>
    <td><input type="text" id="roll"></td>
</tr>

<tr>
    <td><b>Marks</b></td>
    <td><input type="number" id="marks"></td>
</tr>
</table>

<button onclick="displayProfile()">Display</button>

<div id="result"></div>

</div>

<script>

function displayProfile()
{
    let name=document.getElementById("name").value;
    let roll=document.getElementById("roll").value;
    let marks=parseInt(document.getElementById("marks").value);

    let grade;

    if(marks>=90)
        grade="A+";
    else if(marks>=80)
        grade="A";
    else if(marks>=70)
        grade="B";
    else if(marks>=60)
        grade="C";
    else if(marks>=50)
        grade="D";
    else
        grade="Fail";

    document.getElementById("result").style.display="block";

    document.getElementById("result").innerHTML=
    "<h3>Student Details</h3>" +
    "<p><b>Student Name :</b> "+name+"</p>" +
    "<p><b>Roll Number :</b> "+roll+"</p>" +
    "<p><b>Marks :</b> "+marks+"</p>" +
    "<p><b>Grade :</b> "+grade+"</p>";
}

</script>

</body>
</html>
</body>
</html>

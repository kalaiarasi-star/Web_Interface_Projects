</html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter App</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f2f2f2;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        background:white;
        width:350px;
        padding:30px;
        border-radius:12px;
        text-align:center;
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    h1{
        margin-bottom:20px;
        color:#333;
    }

    #counter{
        font-size:60px;
        font-weight:bold;
        color:#007BFF;
        margin:20px 0;
    }

    .buttons{
        display:flex;
        justify-content:space-between;
        margin-top:20px;
    }

    button{
        width:90px;
        padding:10px;
        border:none;
        border-radius:8px;
        font-size:18px;
        cursor:pointer;
        color:white;
    }

    #increase{
        background:green;
    }

    #decrease{
        background:red;
    }

    #reset{
        background:orange;
    }

    button:hover{
        opacity:0.8;
    }
</style>

</head>

<body>

<div class="container">
    <h1>Counter App</h1>

    <div id="counter">0</div>

    <div class="buttons">
        <button id="increase">+1</button>
        <button id="decrease">-1</button>
        <button id="reset">Reset</button>
    </div>
</div>

<script>

let count = 0;

const counter = document.getElementById("counter");
const increase = document.getElementById("increase");
const decrease = document.getElementById("decrease");
const reset = document.getElementById("reset");

increase.addEventListener("click", function(){
    count++;
    counter.innerHTML = count;
});

decrease.addEventListener("click", function(){
    count--;
    counter.innerHTML = count;
});

reset.addEventListener("click", function(){
    count = 0;
    counter.innerHTML = count;
});

</script>

</body>
</html>
